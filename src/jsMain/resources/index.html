<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>The Do Zone</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
      /* Self-hosted CP437 VGA text-mode font (int10h Ultimate Oldschool PC Font Pack) for the DOS theme. */
      @font-face {
        font-family: 'IBM VGA 8x16';
        src: url('/IBM_VGA_8x16.woff') format('woff');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=JetBrains+Mono:wght@400;500;700&family=Syne+Mono&family=Roboto:wght@400;500;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
<!-- PWA: stash the install prompt (fires before the Kotlin bundle boots) for the in-app "Install app"
     menu item, and register the offline service worker. Both are best-effort / no-op where unsupported. -->
<script>
  window.__tdzDeferredInstall = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__tdzDeferredInstall = e;
  });
  window.addEventListener('appinstalled', function () {
    window.__tdzDeferredInstall = null;
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
<!-- Google Identity Services (GIS) for Google Drive sync OAuth. Loaded async; exposes google.accounts.oauth2. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/main.bundle.js"></script>
</body>
</html>
