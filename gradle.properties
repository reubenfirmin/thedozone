kotlin.code.style=official

# The Kotlin/JS IR compiler (esp. compiling the test executable with the kotlin-browser wrappers) needs
# more heap than the default; CI was OOMing ("Java heap space") and GC-thrashing for ~37min before
# failing. Give the Kotlin compiler daemon room. This is read in CI (no global gradle.properties there).
kotlin.daemon.jvmargs=-Xmx4g
